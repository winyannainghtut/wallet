apiVersion: v1
kind: Secret
metadata:
  name: wallet-ai-secrets
  namespace: wallet-app
type: Opaque
stringData:
  # Map key can be PocketBase user id OR user email
  ZAI_API_KEYS_JSON: |
    {
      "admin@wallet.local": "sk-replace-admin-key",
      "finance@wallet.local": "sk-replace-finance-key"
    }
  # Optional fallback if user is not found in mapping
  # ZAI_API_KEY: "sk-replace-fallback-key"
