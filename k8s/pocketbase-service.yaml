apiVersion: v1
kind: Service
metadata:
  name: pocketbase-service
  namespace: wallet-app
  labels:
    app: pocketbase
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app: pocketbase
---
# Optional: Ingress for internal cluster access (if needed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocketbase-ingress
  namespace: wallet-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: pocketbase.internal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocketbase-service
                port:
                  number: 8090
