apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-frontend
  namespace: wallet-app
  labels:
    app: wallet-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-frontend
  template:
    metadata:
      labels:
        app: wallet-frontend
        tier: frontend
    spec:
      containers:
        - name: wallet-app
          image: wallet-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: POCKETBASE_URL
              value: "http://pocketbase-service.wallet-app.svc.cluster.local:8090"
            - name: AUTH_REGISTRATION_ENABLED
              value: "false"
            - name: AUTH_ALLOWED_EMAILS
              value: ""
            - name: AUTH_ALLOWED_DOMAINS
              value: ""
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-frontend-service
  namespace: wallet-app
  labels:
    app: wallet-frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: wallet-frontend
