apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketbase-pvc
  namespace: wallet-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: microk8s-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase
  namespace: wallet-app
  labels:
    app: pocketbase
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketbase
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pocketbase
        tier: backend
    spec:
      initContainers:
        - name: pocketbase-bootstrap
          image: ghcr.io/muchobien/pocketbase:latest
          command:
            - /bin/sh
            - -ec
            - |
              : "${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL is required}"
              : "${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD is required}"
              echo "[bootstrap] applying PocketBase migrations..."
              pocketbase --dir=/pb_data --migrationsDir=/pb_migrations migrate up
              echo "[bootstrap] ensuring superuser exists..."
              pocketbase --dir=/pb_data superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD"
          env:
            - name: PB_SUPERUSER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pocketbase-bootstrap
                  key: PB_SUPERUSER_EMAIL
            - name: PB_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocketbase-bootstrap
                  key: PB_SUPERUSER_PASSWORD
          volumeMounts:
            - name: pocketbase-data
              mountPath: /pb_data
            - name: pocketbase-migrations
              mountPath: /pb_migrations
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      containers:
        - name: pocketbase
          image: ghcr.io/muchobien/pocketbase:latest
          command:
            - /bin/sh
            - -ec
            - |
              pocketbase --dir=/pb_data --publicDir=/pb_public --migrationsDir=/pb_migrations serve --http=0.0.0.0:8090
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: TZ
              value: "Asia/Yangon"
          volumeMounts:
            - name: pocketbase-data
              mountPath: /pb_data
            - name: pocketbase-public
              mountPath: /pb_public
            - name: pocketbase-migrations
              mountPath: /pb_migrations
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: pocketbase-data
          persistentVolumeClaim:
            claimName: pocketbase-pvc
        - name: pocketbase-public
          emptyDir: {}
        - name: pocketbase-migrations
          configMap:
            name: pocketbase-migrations
      restartPolicy: Always
